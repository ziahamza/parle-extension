name: Layer Cache qualification

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CI: true
  PARLE_CI_RUNTIME: Linux-X64-node24-pnpm9.12.0

jobs:
  warm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ziahamza/layercache/action/turbo@main
        with:
          team-url: https://layer-cache.ziahamza.com
          compatibility: parle-ci-v1-linux-x64-node24-pnpm9.12.0
      - run: pnpm ci:quality --cache=remote:rw --summarize

  restore:
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ziahamza/layercache/action/turbo@main
        with:
          team-url: https://layer-cache.ziahamza.com
          compatibility: parle-ci-v1-linux-x64-node24-pnpm9.12.0
      - run: pnpm ci:quality --cache=remote:r --summarize
      - name: Assert remote cache hits
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          const files = readdirSync('.turbo/runs').filter(file => file.endsWith('.json'));
          assert.equal(files.length, 1);
          const report = JSON.parse(readFileSync('.turbo/runs/' + files[0], 'utf8'));
          const tasks = report.tasks.filter(task => task.command);
          assert.ok(tasks.length > 0, 'Expected executable Turbo tasks');
          for (const task of tasks) {
            assert.equal(task.cache.status, 'HIT', task.taskId);
            assert.equal(task.cache.remote, true, task.taskId);
          }
          console.log('Restored ' + tasks.length + ' tasks from Team Cache');
          NODE
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: layercache-restore
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: error
