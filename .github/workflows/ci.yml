name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Types, unit tests, lint, build, package
    # Keep trusted main runs on GitHub. Use lower-cost ephemeral runners for
    # secret-free pull request validation.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Build Chrome Web Store package
        run: pnpm --filter @parle/extension exec wxt zip
      - name: Audit package
        run: node store/check-release.mjs apps/extension/.output/parleextension-0.0.0-chrome.zip
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: parle-chrome-store-${{ github.sha }}
          path: apps/extension/.output/parleextension-0.0.0-chrome.zip
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Real Chrome — 59 behaviours
    runs-on: ${{ github.event_name == 'pull_request' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @parle/extension e2e

  torture:
    name: Real Chrome — 48 adversarial checks
    runs-on: ${{ github.event_name == 'pull_request' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @parle/extension e2e:torture

  safari:
    name: Safari macOS + iOS package
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Safari Web Extension and Apple host project
        run: pnpm package:safari
      - name: Compile the macOS containing app
        run: >-
          xcodebuild
          -project 'apps/extension/.output/safari-apple/Parle/Parle.xcodeproj'
          -scheme 'Parle (macOS)'
          -configuration Debug
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/parle-macos"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Compile the iOS containing app and extension
        run: >-
          xcodebuild
          -project 'apps/extension/.output/safari-apple/Parle/Parle.xcodeproj'
          -scheme 'Parle (iOS)'
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/parle-ios"
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: parle-safari-ios-${{ github.sha }}
          path: |
            apps/extension/.output/parle-safari-web-extension.zip
            apps/extension/.output/safari-apple/Parle
          if-no-files-found: error
          retention-days: 14
