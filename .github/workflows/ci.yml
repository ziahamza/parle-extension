name: CI

# qa/chrome-mv3-latest is a published-artifact branch, not source. Do not add
# it to on.push — a push there must not run this workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Types, unit tests, lint, build, package
    if: github.head_ref != 'qa/chrome-mv3-latest'
    # Keep trusted main runs on GitHub. Use lower-cost ephemeral runners for
    # secret-free pull request validation.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Build Chrome Web Store package
        run: pnpm --filter @parle/extension exec wxt zip
      - name: Audit package
        run: node store/check-release.mjs apps/extension/.output/parleextension-0.0.0-chrome.zip
      - name: Stage durable QA zip
        run: node scripts/publish-chrome-mv3-qa.mjs apps/extension/.output/parleextension-0.0.0-chrome.zip
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: parle-chrome-store-${{ github.sha }}
          path: apps/extension/.output/parleextension-0.0.0-chrome.zip
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Real Chrome — 57 behaviours
    if: github.head_ref != 'qa/chrome-mv3-latest'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @parle/extension e2e

  torture:
    name: Real Chrome — 48 adversarial checks
    if: github.head_ref != 'qa/chrome-mv3-latest'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @parle/extension e2e:torture

  publish-qa-zip:
    name: Publish Chrome MV3 QA zip
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, browser, torture]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: parle-chrome-store-${{ github.sha }}
          path: .qa-zip
      - name: Publish durable QA zip
        env:
          QA_NODE_VERSION: "24"
          QA_PNPM_VERSION: "9.12.0"
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node scripts/publish-chrome-mv3-qa.mjs .qa-zip/parleextension-0.0.0-chrome.zip --push
