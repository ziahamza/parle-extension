name: CI

# qa/chrome-mv3-latest is a published-artifact branch, not source. Do not add
# it to on.push — a push there must not run this workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Types, unit tests, build, package
    if: github.head_ref != 'qa/chrome-mv3-latest'
    # Keep trusted main runs on GitHub. Use lower-cost ephemeral runners for
    # secret-free pull request validation.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 20
    outputs:
      node: ${{ steps.qa-stage.outputs.node }}
      pnpm: ${{ steps.qa-stage.outputs.pnpm }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Build Chrome Web Store package
        run: pnpm --filter @parle/extension exec wxt zip
      - name: Audit package
        run: node store/check-release.ts apps/extension/.output
      - name: Stage durable QA zip
        id: qa-stage
        run: |
          node scripts/publish-chrome-mv3-qa.ts apps/extension/.output
          echo "node=$(node -v)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(pnpm -v)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: parle-chrome-store-${{ github.sha }}
          path: apps/extension/.output/*-chrome.zip
          if-no-files-found: error
          retention-days: 14
          # `.output` is a hidden directory, and upload-artifact applies its
          # hidden-file exclusion while expanding a glob — so a `*` pattern
          # inside it matches nothing and the step fails with "No files were
          # found". An explicit filename uploads fine, which is why this only
          # broke once the path became a glob: the zip's name carries the
          # version now, so it had to.
          include-hidden-files: true

  browser:
    name: Real Chrome — 63 behaviours
    # qa/chrome-mv3-latest carries a built zip and no source, so there is
    # nothing for the behaviour suite to run against.
    if: github.head_ref != 'qa/chrome-mv3-latest'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @parle/extension e2e

  torture:
    name: Real Chrome — 48 adversarial checks
    if: github.head_ref != 'qa/chrome-mv3-latest'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @parle/extension e2e:torture

  safari:
    name: Safari macOS + iOS package
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Safari Web Extension and Apple host project
        run: pnpm package:safari
      - name: Compile the macOS containing app
        run: >-
          xcodebuild
          -project 'apps/extension/.output/safari-apple/Parle/Parle.xcodeproj'
          -scheme 'Parle (macOS)'
          -configuration Debug
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/parle-macos"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Compile the iOS containing app and extension
        run: >-
          xcodebuild
          -project 'apps/extension/.output/safari-apple/Parle/Parle.xcodeproj'
          -scheme 'Parle (iOS)'
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/parle-ios"
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: parle-safari-ios-${{ github.sha }}
          path: |
            apps/extension/.output/parle-safari-web-extension.zip
            apps/extension/.output/safari-apple/Parle
          if-no-files-found: error
          retention-days: 14

  publish-qa-zip:
    name: Publish Chrome MV3 QA zip
    # `push` specifically, not merely "not a pull request": a workflow_dispatch
    # on main also satisfied that and republished the QA branch from a button,
    # which is not what the branch is for. Raised in review on #12.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [quality, browser, torture]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: parle-chrome-store-${{ github.sha }}
          path: .qa-zip
      - name: Publish durable QA zip
        env:
          QA_NODE_VERSION: ${{ needs.quality.outputs.node }}
          QA_PNPM_VERSION: ${{ needs.quality.outputs.pnpm }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node scripts/publish-chrome-mv3-qa.ts .qa-zip --push
