name: CI

# qa/chrome-mv3-latest is a published-artifact branch, not source. Do not add
# it to on.push — a push there must not run this workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are waste and should be cancelled. A `main`
  # run is not: `publish-qa-zip` force-pushes an artifact branch after three
  # jobs have already passed, and a second push to `main` landing mid-push
  # would abort it there. `release.yml` refuses the same class of abort for the
  # same reason.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CI: true
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_TEAM: gitstart
  # Pull-request code must never receive the long-lived read/write credential:
  # it could exfiltrate the token or populate a poisoned result that a later
  # main/release run trusts. PRs still use their branch-scoped Actions cache;
  # only trusted push/dispatch runs may read and write the shared Vercel cache.
  TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}

jobs:
  quality:
    name: Types, unit tests, build, package
    if: github.head_ref != 'qa/chrome-mv3-latest'
    # Keep trusted main runs on GitHub. Use lower-cost ephemeral runners for
    # secret-free pull request validation.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      PARLE_CI_RUNTIME: Linux-X64-node24-pnpm9.12.0
    outputs:
      node: ${{ steps.qa-stage.outputs.node }}
      pnpm: ${{ steps.qa-stage.outputs.pnpm }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: parle-turbo-${{ runner.os }}-${{ runner.arch }}-node24-pnpm9.12.0-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            parle-turbo-${{ runner.os }}-${{ runner.arch }}-node24-pnpm9.12.0-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: Report an unavailable shared cache
        if: env.TURBO_TOKEN == ''
        run: echo "::warning::Shared Turbo credentials are unavailable; this run will use only its scoped Actions/Turbo cache."
      - name: Run the deterministic quality graph
        run: pnpm ci:quality
      # The publish path only runs on `main`, so its code was typechecked and
      # never executed until it failed in production — twice. This exercises
      # both arms against a throwaway bare repository on every run: the refusal
      # when a runner has no credentials, and a real clone/commit/force-push.
      - name: Exercise the QA publish paths
        run: |
          set -euo pipefail

          # A non-zero exit is not evidence. Staging and the store audit both
          # run before `pushRemote()`, so a missing zip, a stale `.output` or a
          # rejected package would each exit 1 and look exactly like the guard
          # firing. Assert the sentence, not the status.
          echo "--- refuses to push from a runner with no credentials ---"
          set +e
          guard="$(env -u GITHUB_TOKEN -u GITHUB_REPOSITORY -u QA_PUSH_REMOTE GITHUB_ACTIONS=true \
            node scripts/publish-chrome-mv3-qa.ts apps/extension/.output --push 2>&1)"
          guard_rc=$?
          set -e
          echo "$guard"
          [ "$guard_rc" -ne 0 ] || { echo "::error::the credential guard did not fire"; exit 1; }
          case "$guard" in
            *"no push credentials"*) ;;
            *) echo "::error::exited $guard_rc, but not for want of credentials"; exit 1 ;;
          esac

          # GITHUB_TOKEN and GITHUB_REPOSITORY are unset here too, not just
          # GITHUB_ACTIONS. The token is authoritative over QA_PUSH_REMOTE now,
          # and Actions always sets GITHUB_REPOSITORY — so the day this job
          # gains a token for any reason, this loop would stop talking to the
          # throwaway repository and start force-pushing the real artifact
          # branch from every pull request.
          echo "--- clones, commits and force-pushes for real ---"
          bare="$(mktemp -d)/qa.git"; git init -q --bare "$bare"
          for attempt in 1 2; do
            echo "QA publish proof $attempt of 2"
            env -u GITHUB_ACTIONS -u GITHUB_TOKEN -u GITHUB_REPOSITORY \
              QA_PUSH_REMOTE="$bare" QA_SOURCE_SHA="$GITHUB_SHA" \
              node scripts/publish-chrome-mv3-qa.ts apps/extension/.output --push
          done

          commits="$(git --git-dir="$bare" rev-list --count qa/chrome-mv3-latest)"
          echo "commits on the artifact branch: $commits"
          [ "$commits" = "1" ] || { echo "::error::expected one orphan commit, got $commits"; exit 1; }
          rm -rf dist-qa

      - name: Stage durable QA zip
        id: qa-stage
        run: |
          node scripts/publish-chrome-mv3-qa.ts apps/extension/.output
          echo "node=$(node -v)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(pnpm -v)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: parle-chrome-store-${{ github.sha }}
          path: apps/extension/.output/*-chrome.zip
          if-no-files-found: error
          retention-days: 14
          # `.output` is a hidden directory, and upload-artifact applies its
          # hidden-file exclusion while expanding a glob — so a `*` pattern
          # inside it matches nothing and the step fails with "No files were
          # found". An explicit filename uploads fine, which is why this only
          # broke once the path became a glob: the zip's name carries the
          # version now, so it had to.
          include-hidden-files: true

  browser:
    name: Real Chrome — 82 behaviours
    # qa/chrome-mv3-latest carries a built zip and no source, so there is
    # nothing for the behaviour suite to run against.
    if: github.head_ref != 'qa/chrome-mv3-latest'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      PARLE_CI_RUNTIME: Linux-X64-node24-pnpm9.12.0
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: parle-turbo-${{ runner.os }}-${{ runner.arch }}-node24-pnpm9.12.0-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            parle-turbo-${{ runner.os }}-${{ runner.arch }}-node24-pnpm9.12.0-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm e2e

  torture:
    name: Real Chrome — 48 adversarial checks
    if: github.head_ref != 'qa/chrome-mv3-latest'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      PARLE_CI_RUNTIME: Linux-X64-node24-pnpm9.12.0
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: parle-turbo-${{ runner.os }}-${{ runner.arch }}-node24-pnpm9.12.0-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            parle-turbo-${{ runner.os }}-${{ runner.arch }}-node24-pnpm9.12.0-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - name: Run all adversarial checks in a fresh browser
        run: pnpm e2e:torture --force

  safari:
    name: Safari macOS + iOS package
    runs-on: macos-15
    timeout-minutes: 25
    env:
      PARLE_CI_RUNTIME: macos-15-node24-pnpm9.12.0
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: parle-turbo-${{ runner.os }}-${{ runner.arch }}-node24-pnpm9.12.0-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            parle-turbo-${{ runner.os }}-${{ runner.arch }}-node24-pnpm9.12.0-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: Build Safari Web Extension and Apple host project
        run: pnpm package:safari
      - name: Compile the macOS containing app
        run: >-
          xcodebuild
          -project 'apps/extension/.output/safari-apple/Parle/Parle.xcodeproj'
          -scheme 'Parle (macOS)'
          -configuration Debug
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/parle-macos"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Compile the iOS containing app and extension
        run: >-
          xcodebuild
          -project 'apps/extension/.output/safari-apple/Parle/Parle.xcodeproj'
          -scheme 'Parle (iOS)'
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/parle-ios"
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: parle-safari-ios-${{ github.sha }}
          path: |
            apps/extension/.output/parle-safari-web-extension.zip
            apps/extension/.output/safari-apple/Parle
          if-no-files-found: error
          retention-days: 14

  publish-qa-zip:
    name: Publish Chrome MV3 QA zip
    # `push` specifically, not merely "not a pull request": a workflow_dispatch
    # on main also satisfied that and republished the QA branch from a button,
    # which is not what the branch is for. Raised in review on #12.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [quality, browser, torture]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: parle-chrome-store-${{ github.sha }}
          path: .qa-zip
      - name: Publish durable QA zip
        env:
          # Actions does not put the job token in the environment on its own,
          # and `actions/checkout`'s credential helper only covers the checkout
          # — this script pushes from its own temp clone, which inherits none of
          # it. Without this the push reached the remote unauthenticated and
          # died on "could not read Username for 'https://github.com'".
          GITHUB_TOKEN: ${{ github.token }}
          QA_NODE_VERSION: ${{ needs.quality.outputs.node }}
          QA_PNPM_VERSION: ${{ needs.quality.outputs.pnpm }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node scripts/publish-chrome-mv3-qa.ts .qa-zip --push
