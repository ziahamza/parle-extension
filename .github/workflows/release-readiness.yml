name: Release readiness

on:
  # The listing cannot be pushed from here — the Chrome Web Store API has no
  # method for the description, the screenshots or the URLs, and
  # `store/LISTING.md` explains why. What CAN be done on a timer is notice that
  # it has gone stale, which is the failure mode that matters: a listing URL
  # that stops resolving does not fail when it breaks, it fails weeks later
  # during a review.
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
    inputs:
      article:
        description: Optional public article URL for the store screenshots
        required: false
        type: string

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  store:
    name: Store package and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install screenshot tooling and fonts
        run: sudo apt-get update && sudo apt-get install -y imagemagick fonts-noto-core
      - name: Build upload package
        run: pnpm --filter @parle/extension exec wxt zip
      - name: Regenerate store screenshots in real Chrome
        env:
          PARLE_STORE_ARTICLE: ${{ inputs.article }}
        run: pnpm --filter @parle/extension e2e:store
      - name: Audit package and all five screenshots
        run: node store/check-release.ts apps/extension/.output store/screenshots

      # Field lengths, asset shapes, and every listing URL fetched anonymously —
      # which is the state a reviewer sees. Runs last so that a URL that has
      # rotted does not hide a screenshot that failed to regenerate.
      - name: Audit the store listing
        run: node store/check-listing.ts

      # `always()` because this run exists to TELL you the listing drifted, and
      # a failing audit is exactly when the regenerated screenshots and the
      # paste-ready text are worth having. Uploading only on success would hand
      # you the evidence precisely when you do not need it.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: parle-store-release-${{ github.sha }}
          path: |
            apps/extension/.output/*-chrome.zip
            store/screenshots/*.png
            store/summary.txt
            store/description.txt
          if-no-files-found: error
          retention-days: 30
          # `.output` is a hidden directory, and upload-artifact applies its
          # hidden-file exclusion while expanding a glob — so a `*` pattern
          # inside it matches nothing and the step fails with "No files were
          # found". An explicit filename uploads fine, which is why this only
          # broke once the path became a glob: the zip's name carries the
          # version now, so it had to.
          include-hidden-files: true
